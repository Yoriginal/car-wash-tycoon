# Tests : sur chaque push et chaque Pull Request.
# La publication est faite par pages.yml, déclenchée quand ces tests réussissent.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Test d'interface (navigateur)
        if: hashFiles('tests/ui.smoke.cjs') != ''
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run test:ui

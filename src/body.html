<title>Car Wash Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Monoton&family=Righteous&display=swap">
<style>
/*STYLE*/
</style>
<div id="app">
  <header id="hud">
    <button class="capsule tresor" id="hud-cash" data-test="hud-cash" aria-label="Trésorerie, ouvrir la banque">
      <span class="coin-wrap"></span>
      <span class="tresor-txt"><b class="num" id="cash">0 €</b><small class="trend up" id="trend"></small></span>
    </button>
    <div class="hud-centre">
      <div class="lu hud-date" id="hud-date"></div>
      <button class="capsule meteo" id="hud-meteo" aria-label="Météo"><span id="wx"></span><span id="wx-name"></span><span class="wx-ev" id="wx-ev" hidden></span></button>
    </div>
    <div class="lu hud-niveau"><span class="petites-caps">Niveau</span><b class="num" id="niveau">1</b></div>
    <button class="rond cloche" id="hud-bell" data-test="bell" aria-label="Alertes"><span class="ic bell-ic"></span><span class="badge num" id="bell-n" hidden>0</span></button>
  </header>
  <main id="view"></main>
  <button class="capsule objectif" id="objective" data-test="objective" hidden><span class="obj-ic"></span><span class="obj-col"><span class="txt"></span><span class="jauge" hidden><i></i></span></span><span class="obj-val num"></span></button>
  <div id="dock">
    <div id="tools" hidden></div>
    <nav id="nav" aria-label="Navigation"></nav>
  </div>
  <div id="backdrop" class="backdrop" hidden></div>
  <div id="toasts" aria-live="polite"></div>
</div>
